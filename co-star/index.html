<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Co-Star</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wdth,wght@75..125,400..800&family=Catamaran:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Brand tokens shared by every game. Games use these variables and never hard-code brand colours or fonts.
   Fonts load from design/fonts.html. Build inlines both into each game's client at <!--BRAND-->. */
:root {
  --night: #17123B; --night-2: #221B4F; --night-3: #2E2662; --line: rgba(255,244,226,.10);
  --stage: #0D0A24; --paper: #FFF4E2; --muted: #B9B0D9;
  --gold: #FFC627; --coral: #FF5A5F; --mint: #3DDC97;
  --t-pink: #FF8FB1; --t-yellow: #FFD45C; --t-mint: #8FE3C6; --ink: #17123B;
  color-scheme: dark;
  --display: "Anek Tamil", system-ui, sans-serif; --body: "Catamaran", system-ui, sans-serif;
}
/* House UI shared by every game: phone frame, header, timer ring, buttons, autocomplete answer field, reveal,
   ratings, end screen. Uses only design/tokens.css variables. Inlined by tools/build.py at <!--BRAND-->.
   A game's own stylesheet holds only what is unique to it (Three Clues' tickets, Co-Star's route rail). */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--stage); color: var(--paper); font-family: var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.app { max-width: 430px; min-height: 100%; margin: 0 auto; background: var(--night); display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); }
@media (min-width: 600px) { body { padding: 32px 0; } .app { min-height: 820px; border-radius: 36px; box-shadow: 0 0 0 10px #050414, 0 0 0 11px #2a2450, 0 30px 60px rgba(0,0,0,.5); } }
.screen { flex: 1; display: flex; flex-direction: column; }

.head { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-bottom: 14px; }
.head .r { font-size: 15px; font-weight: 600; color: var(--muted); }
.head .r b { color: var(--paper); }
.score { font-family: var(--display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.score small { font-family: var(--body); font-weight: 600; font-size: 13px; color: var(--muted); margin-right: 4px; }
.timer { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; color: var(--coral); }
.timer svg { width: 26px; height: 26px; }
.timer .bg { stroke: var(--coral); opacity: .22; }
.timer .fg { stroke: var(--coral); transition: stroke-dashoffset 1s linear; }

.btn { min-height: 54px; border-radius: 16px; border: 0; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.btn-primary { background: var(--gold); color: var(--ink); }
.btn-quiet { background: var(--night-2); color: var(--paper); }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); }

/* start */
.hero { padding: 48px 0 28px; }
.hero h1 { font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: 56px; line-height: .92; letter-spacing: -.01em; margin-top: 10px; }
.hero p { color: var(--muted); font-size: 17px; line-height: 1.45; margin-top: 14px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--night-2); border-radius: 14px; padding: 4px; margin: 8px 0 22px; }
.seg button { min-height: 44px; border: 0; background: none; font-size: 15px; font-weight: 600; color: var(--muted); border-radius: 10px; }
.seg button[aria-pressed="true"] { background: var(--night-3); color: var(--paper); box-shadow: inset 0 0 0 1px rgba(255,244,226,.12); }
.meta-line { font-size: 13px; color: var(--muted); text-align: center; margin-top: 12px; }

.row { display: flex; gap: 10px; margin-top: 14px; }
.row .btn { min-height: 46px; font-size: 15px; white-space: nowrap; }
.row .btn.fit { flex: 0 0 auto; width: auto; padding-inline: 22px; }
.misses { min-height: 22px; margin: 14px 4px 0; font-size: 15px; color: var(--muted); }
.misses s { color: var(--coral); text-decoration-thickness: 1.5px; margin-right: 8px; }

/* answer field with autocomplete */
.answer { margin-top: auto; padding-top: 16px; position: relative; }
.suggest { background: var(--night-2); border-radius: 16px; padding: 6px; margin-bottom: 8px; }
.suggest:empty { display: none; }
.sug { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 50px; padding: 0 12px; border-radius: 12px; width: 100%; border: 0; background: none; text-align: left; }
.sug[aria-selected="true"], .sug:hover { background: var(--night-3); }
.sug .t { font-size: 17px; font-weight: 700; }
.sug .t mark { background: none; color: var(--gold); }
.sug .m { font-size: 13px; color: var(--muted); flex: none; }
.field { display: flex; align-items: center; gap: 10px; height: 54px; background: var(--paper); color: var(--ink); border-radius: 16px; padding: 0 7px 0 16px; }
.field.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.field input { flex: 1; border: 0; background: none; font: inherit; font-size: 17px; font-weight: 600; color: var(--ink); min-width: 0; }
.field input:focus-visible { outline: none; }
.field input::placeholder { color: #6E6890; font-weight: 500; }
.field .go { width: 42px; height: 42px; border-radius: 12px; background: var(--ink); color: var(--gold); display: grid; place-items: center; border: 0; flex: none; }
.field .go svg { width: 20px; height: 20px; }

/* reveal */
.reveal-top { text-align: center; padding: 22px 0 18px; }
.verdict { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 8px; margin-bottom: 12px; color: var(--ink); }
.verdict.win { background: var(--mint); } .verdict.lose { background: var(--coral); } .verdict.near { background: var(--gold); }
.film { font-family: var(--display); font-weight: 800; font-stretch: 88%; font-size: 48px; line-height: .95; letter-spacing: -.01em; overflow-wrap: anywhere; }
.film-ta { font-family: var(--display); font-weight: 600; font-size: 22px; color: var(--muted); margin-top: 6px; }
.film-meta { font-size: 14px; color: var(--muted); margin-top: 8px; }
.points { font-family: var(--display); font-weight: 800; font-size: 40px; color: var(--mint); text-align: center; font-variant-numeric: tabular-nums; }
.points.zero { color: var(--muted); }
.why { background: var(--night-2); border-radius: 16px; padding: 14px 16px; margin-top: 14px; font-size: 15px; line-height: 1.45; color: var(--muted); }
.why b { color: var(--paper); font-weight: 600; }
.rate { margin-top: 14px; }
.rate .opts { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-top: 8px; }
.rate button { min-height: 52px; border: 0; border-radius: 12px; background: var(--night-2); font-size: 13px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.rate button span { font-size: 18px; }
.rate button[aria-pressed="true"] { background: var(--night-3); color: var(--paper); box-shadow: inset 0 0 0 1.5px var(--gold); }
.next-wrap { margin-top: auto; padding-top: 16px; display: grid; gap: 8px; }

/* end */
.mark { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; vertical-align: 1px; }
.mark.hit { background: var(--mint); } .mark.near { background: var(--gold); } .mark.miss { background: transparent; box-shadow: inset 0 0 0 2px var(--coral); }
.sync-note { text-align: center; }
.sync-note.bad { color: var(--coral); }
.export { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; min-height: 32px; }

.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { .field.shake { animation: none; } .timer .fg { transition: none; } }
</style>
<style>
  /* Co-Star only: name plates, the route rail, cast chips. Everything else comes from design/kit.css. */
  .plate { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 12px; padding: 12px 16px; color: var(--ink); min-height: 64px; }
  .plate .k { font-size: 12px; font-weight: 700; letter-spacing: .06em; opacity: .7; }
  .plate .n { font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: 30px; line-height: 1; text-transform: uppercase; overflow-wrap: anywhere; margin-top: 3px; }
  .plate.from { background: var(--t-pink); } .plate.to { background: var(--t-mint); }
  .plate .stub { flex: none; text-align: center; padding-left: 14px; border-left: 2px dashed rgba(23,18,59,.28); }
  .plate .stub b { display: block; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; }
  .plate .stub small { font-size: 11px; font-weight: 700; opacity: .7; }

  .rail { display: flex; flex-direction: column; }
  .hop { position: relative; display: flex; flex-direction: column; gap: 6px; margin-left: 22px; padding: 8px 0 8px 18px; border-left: 2px dashed rgba(255,198,39,.45); }
  .reel { display: inline-flex; align-items: baseline; gap: 8px; align-self: flex-start; background: var(--t-yellow); color: var(--ink); border-radius: 6px; padding: 4px 10px; max-width: 100%; }
  .reel b { font-family: var(--display); font-weight: 800; font-size: 15px; text-transform: uppercase; overflow-wrap: anywhere; }
  .reel small { font-size: 12px; font-weight: 700; opacity: .65; font-variant-numeric: tabular-nums; }
  .who { align-self: flex-start; background: var(--night-2); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 16px; }
  .slot { align-self: flex-start; border: 1.5px dashed rgba(185,176,217,.45); color: var(--muted); border-radius: 8px; padding: 5px 12px; font-size: 14px; font-weight: 600; }
  .rail.small .plate { min-height: 0; padding: 8px 12px; }
  .rail.small .plate .n { font-size: 20px; }
  .rail.small .hop { margin-left: 16px; padding: 5px 0 5px 14px; }

  .mini-route { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
  .mini-route .p { font-family: var(--display); font-weight: 800; font-size: 15px; padding: 5px 11px; border-radius: 7px; color: var(--ink); text-transform: uppercase; }
  .mini-route .line { flex: 1; max-width: 64px; border-top: 2px dashed rgba(255,198,39,.6); }

  .prompt { font-size: 16px; color: var(--muted); margin: 0 4px 10px; line-height: 1.4; }
  .prompt b { color: var(--paper); }
  .cast { display: flex; flex-wrap: wrap; gap: 8px; }
  .cast button { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: var(--night-2); font-size: 16px; font-weight: 700; }
  .cast button:hover { background: var(--night-3); }
  .stage { margin-top: auto; padding-top: 16px; }
  .duo { font-family: var(--display); font-weight: 800; font-stretch: 88%; font-size: 34px; line-height: 1; text-transform: uppercase; overflow-wrap: anywhere; }
  .duo span { color: var(--gold); padding: 0 6px; }
  .label { margin: 16px 4px 8px; }
  .why .rail { margin-top: 10px; }
  .why .reel b { color: var(--ink); }
  .why .who { background: var(--night-3); color: var(--paper); }
  .plate.pop { animation: pop .4s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop { from { transform: scale(.94); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .plate.pop { animation: none; } }
</style>
</head>
<body>
<main class="app" id="app">
<style>.home-link{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:32px;margin:-6px 0 6px;
font-size:14px;font-weight:600;color:var(--muted);text-decoration:none}.home-link:hover{color:var(--paper)}</style>
<a class="home-link" href="../">‹ All games</a>

  <!-- START -->
  <section class="screen" id="screen-start">
    <div class="hero">
      <div class="eyebrow">Prototype · solo play</div>
      <h1>Co-Star</h1>
      <p>Two stars. Link them through the films they shared, one co-star at a time. Fewest films wins.</p>
      <div class="mini-route" aria-hidden="true"><span class="p" style="background:var(--t-pink)">Rajini</span><span class="line"></span><span class="p" style="background:var(--t-yellow)">Par 2</span><span class="line"></span><span class="p" style="background:var(--t-mint)">Kavin</span></div>
    </div>
    <div class="eyebrow" style="margin-left:4px">Difficulty</div>
    <div class="seg" role="group" aria-label="Difficulty">
      <button data-level="any" aria-pressed="true">Mixed</button>
      <button data-level="easy" aria-pressed="false">Easy</button>
      <button data-level="medium" aria-pressed="false">Medium</button>
      <button data-level="hard" aria-pressed="false">Hard</button>
    </div>
    <div style="margin-top:auto"></div>
    <button class="btn btn-primary" id="btn-start"></button>
    <p class="meta-line" id="pool-line"></p>
  </section>

  <!-- ROUND -->
  <section class="screen hidden" id="screen-round">
    <div class="head">
      <span class="r">Round <b id="r-num">1</b> of <span id="r-total">5</span></span>
      <span class="timer" aria-live="off">
        <svg viewBox="0 0 26 26" aria-hidden="true"><circle class="bg" cx="13" cy="13" r="10.5" fill="none" stroke-width="3"/><circle class="fg" id="t-ring" cx="13" cy="13" r="10.5" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="66" stroke-dashoffset="0" transform="rotate(-90 13 13)"/></svg>
        <span id="t-text">1:30</span>
      </span>
    </div>
    <div class="rail" id="rail" aria-live="polite"></div>
    <div class="row">
      <button class="btn btn-quiet" id="btn-undo" style="flex:1">Undo</button>
      <button class="btn btn-quiet fit" id="btn-give-up">Give up</button>
    </div>
    <div class="misses" id="misses" aria-live="polite"></div>
    <div class="stage">
      <p class="prompt" id="prompt"></p>
      <div class="cast hidden" id="cast" role="group" aria-label="Cast"></div>
      <form class="answer" id="answer-form" autocomplete="off" style="padding-top:0">
        <div class="suggest" id="suggest" role="listbox" aria-label="Films"></div>
        <div class="field" id="field">
          <input id="film-input" type="text" placeholder="Type a film…" aria-label="Film" aria-autocomplete="list" aria-controls="suggest">
          <button class="go" type="submit" aria-label="Pick film"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </form>
    </div>
  </section>

  <!-- REVEAL -->
  <section class="screen hidden" id="screen-reveal">
    <div class="head">
      <span class="r">Round <b id="v-num">1</b> of <span id="v-total">5</span></span>
      <span class="score"><small>Score</small><span id="v-score">0</span></span>
    </div>
    <div class="reveal-top">
      <span class="verdict" id="v-verdict"></span>
      <div class="duo" id="v-duo"></div>
    </div>
    <div class="points" id="v-points"></div>
    <div id="v-yours"></div>
    <div class="why" id="v-best"></div>
    <div class="rate">
      <div class="eyebrow" style="margin-left:4px">How was this pair?</div>
      <div class="opts" id="rate" role="group" aria-label="Rate this pair">
        <button data-rate="loved" aria-pressed="false"><span>🔥</span>Loved</button>
        <button data-rate="easy" aria-pressed="false"><span>🥱</span>Too easy</button>
        <button data-rate="hard" aria-pressed="false"><span>🤯</span>Too hard</button>
        <button data-rate="wrong" aria-pressed="false"><span>🚩</span>Wrong data</button>
      </div>
    </div>
    <div class="next-wrap">
      <button class="btn btn-primary" id="btn-next-round">Next round</button>
    </div>
  </section>

  <!-- END -->
  <section class="screen hidden" id="screen-end">
    <div class="hero" style="text-align:center">
      <div class="eyebrow" id="e-sub"></div>
      <h1 style="font-size:52px" id="e-title"></h1>
      <p id="e-line"></p>
    </div>
    <div class="why" id="e-list"></div>
    <div class="next-wrap">
      <button class="btn btn-primary" id="btn-again">Play again</button>
      <p class="eyebrow sync-note" id="sync-note" hidden aria-live="polite"></p>
    </div>
  </section>

</main>

<script>
/* Shared client kit for every game. Inlined by tools/build.py at the KIT marker, before the game's own script.
   Kit.$ / esc / norm / store / shake       small helpers
   Kit.screens(names)                       returns show(name): one <section id="screen-<name>"> visible at a time
   Kit.save(path, data) / Kit.remove(path)  write to the artifact's shared db when published (no-op from a file)
   Kit.renderSync(el, reader)               end-screen line saying whether results were saved, never silent
   Kit.autocomplete({...})                  answer field with suggestions, arrow keys and Enter
   Kit.countdown({...})                     timer ring + m:ss text
   Kit.rating({...})                        Loved / Too easy / Too hard / Wrong buttons, saved locally and to the db */
const Kit = (() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // Same rule as tools/common.answer_key: lowercase, accents and punctuation dropped, Tamil script kept.
  const norm = (s) => (s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9஀-௿]/g, "");
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const shake = (el) => { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); };
  const screens = (names) => (id) => { for (const s of names) $("screen-" + s).classList.toggle("hidden", s !== id); };
  const mmss = (s) => `${Math.floor(Math.max(s, 0) / 60)}:${String(Math.max(s, 0) % 60).padStart(2, "0")}`;

  // ---- results to the artifact db. state: local (plain file) | checking | on | off ----
  let db = null, me = "local";
  const sync = { state: window.claude?.use ? "checking" : "local", saved: 0, failed: 0, error: "" };
  const ready = (async () => {
    if (sync.state === "local") return false;
    try {
      db = await window.claude.use("db");
      const user = await window.claude.use("user");
      if (user) me = (await user.id()) || "anon";
    } catch (e) { sync.error = e?.code || e?.message || String(e); }
    sync.state = db ? "on" : "off";
    return !!db;
  })();
  let syncEl = null, syncReader = "";
  const write = (fn) => {
    if (!db) return;
    fn(db).then(() => { sync.saved++; paint(); })
      .catch((e) => { sync.failed++; sync.error = e?.code || e?.message || String(e); console.warn("db write failed", e); paint(); });
  };
  const tag = () => me.slice(0, 8);
  const save = (path, data) => write((d) => d.doc(path).set({ ...data, player: me, at: new Date().toISOString() }));
  const remove = (path) => write((d) => d.doc(path).delete());
  function paint() {
    if (!syncEl) return;
    const t = {
      local: "",
      checking: "Still connecting, so results may not be saved.",
      off: "Not saved: this view can't reach the shared store. Open the artifact while signed in with edit access.",
      on: sync.failed ? `Not saved: ${sync.failed} of ${sync.saved + sync.failed} saves failed (${sync.error}).` : `Saved ${sync.saved} results for ${syncReader}.`,
    }[sync.state];
    syncEl.textContent = t; syncEl.hidden = !t; syncEl.classList.toggle("bad", sync.state !== "on" || sync.failed > 0);
  }
  const renderSync = (el, reader) => { syncEl = el; syncReader = reader; paint(); };

  // ---- autocomplete answer field ----
  // search(q) -> [{label, meta, value}]; onPick(item) when a suggestion is chosen; onText(text) on Enter with none.
  function autocomplete({ form, input, list, search, onPick, onText = () => {}, max = 4 }) {
    let items = [], sel = 0;
    const render = () => {
      const q = input.value.trim();
      items = q.length >= 2 ? search(q).slice(0, max) : [];
      sel = 0; list.innerHTML = "";
      items.forEach((it, i) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "sug"; b.setAttribute("role", "option"); b.setAttribute("aria-selected", i === sel);
        const k = it.label.toLowerCase().indexOf(q.toLowerCase());
        const label = k >= 0 ? esc(it.label.slice(0, k)) + "<mark>" + esc(it.label.slice(k, k + q.length)) + "</mark>" + esc(it.label.slice(k + q.length)) : esc(it.label);
        b.innerHTML = `<span class="t">${label}</span><span class="m">${esc(it.meta ?? "")}</span>`;
        b.addEventListener("click", () => pick(it));
        list.appendChild(b);
      });
    };
    const pick = (it) => { input.value = ""; render(); onPick(it); };
    input.addEventListener("input", render);
    input.addEventListener("keydown", (e) => {
      if (!items.length || (e.key !== "ArrowDown" && e.key !== "ArrowUp")) return;
      e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
      [...list.children].forEach((o, i) => o.setAttribute("aria-selected", i === sel));
    });
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (items.length) return pick(items[sel]);
      const t = input.value.trim(); if (t) onText(t);
    });
    return { clear() { input.value = ""; render(); }, focus() { setTimeout(() => input.focus(), 50); } };
  }

  // ---- countdown with ring (circle.fg with r=10.5 -> circumference 66) ----
  function countdown({ ring, text, onEnd, onTick = () => {} }) {
    let timer = null, total = 1, left = 0;
    const paintT = () => { text.textContent = mmss(left); ring.style.strokeDashoffset = 66 * (1 - Math.max(left, 0) / total); onTick(left); };
    return {
      start(seconds) { clearInterval(timer); total = left = seconds; paintT(); timer = setInterval(() => { left--; paintT(); if (left <= 0) { clearInterval(timer); onEnd(); } }, 1000); },
      stop() { clearInterval(timer); },
      get left() { return left; }, get total() { return total; }, mmss,
    };
  }

    return { show(itemId, itemMeta) { id = itemId; meta = itemMeta; paintR(); }, all: () => all };

,2162,4266,5192,5291]],["f838","Siragugal",1999,["siragugal"],[133,353,1284,1781,1828]],["f839","Sivan",1999,["sivan"],[183,307,353,1275,2207,2285,2655,4266,4954,5283]],["f840","Sundari Neeyum Sundaran Naanum",1999,["sundarineeyumsundarannaanum"],[389,5550]],["f842","Suryodayam",1999,["suryodayam"],[360,536]],["f849","Ullathai Killathe",1999,["ullathaikillathe"],[182,563,1388]],["f856","Annai",2000,["annai"],[80,202,312,583,588,1992,2576,5356]],["f858","Aval Paavam",2000,["avalpaavam"],[702,1513,1826]],["f861","Chinna Chinna Kannile",2000,["chinnachinnakannile"],[312,340,563]],["f864","En Sakhiye",2000,["ensakhiye"],[1695,3573,4677]],["f869","Independence Day",2000,["independenceday"],[243,403,553,744,983,1009,2359,2468,2744]],["f876","Kann Thirandhu Paaramma",2000,["kannthirandhupaaramma"],[416,2423,3324]],["f888","Manasu",2000,["manasu"],[419,532,1514]],["f891","Nagalingam",2000,["nagalingam"],[391,3065]],["f892","Nee Enthan Vaanam",2000,["neeenthanvaanam"],[363,1823,5192,5667]],["f896","Penngal",2000,["penngal"],[57,83,3238,5617]],["f900","Puratchikkaaran",2000,["puratchikkaaran"],[426,553]],["f912","Unakkaga Mattum",2000,["unakkagamattum"],[1419,2341,3220]],["f928","Asathal",2001,["asathal"],[202,235,272,426,519,2160,5283]],["f929","Asokavanam",2001,["asokavanam"],[1578,1825,5357]],["f940","Engalukkum Kaalam Varum",2001,["engalukkumkaalamvarum"],[272,419,934,1153,1838,2342,2448,2936,4190,5192]],["f943","Kaatrukkenna Veli",2001,["kaatrukkennaveli"],[553,563,1825]],["f946","Kanna Unnai Thedukiren",2001,["kannaunnaithedukiren"],[542,2346,3016,3084,3491]],["f955","Love Marriage",2001,["lovemarriage"],[519,532,1520]],["f957","Maayan",2001,["maayan"],[312,400,403,744,1735,1891,2001,2177,3142,4988]],["f972","Ponnana Neram",2001,["ponnananeram"],[2386,4765]],["f989","Vadagupatti Maapillai",2001,["vadagupattimaapillai"],[52,542,3977,5667]]]};
const R = DATA.game.rules;
const { $, esc, norm } = Kit;
const show = Kit.screens(["start", "round", "reveal", "end"]);

// people: [id, name]; films: [id, title, year, keys, castIdx[]]. Cast holds people ids.
const names = Object.fromEntries(DATA.people.map(([id, n]) => [id, n]));
const films = {};
for (const [id, title, year, keys, cast] of DATA.films) films[id] = { id, title, year, keys, cast: new Set(cast.map((i) => DATA.people[i][0])) };
const filmsOf = {};
for (const f of Object.values(films)) for (const p of f.cast) (filmsOf[p] ??= []).push(f.id);
const isFilm = (x) => x in films;
const label = (x) => isFilm(x) ? films[x].title : names[x];

let level = "any", queue = [], round = 0, score = 0, history = [];
let cur = null, chain = [], misses = [];

$("btn-start").textContent = `Play ${R.rounds} rounds`;
function pool() { return DATA.puzzles.filter((p) => level === "any" || p.level === level); }
function updatePoolLine() {
  const years = Object.values(films).map((f) => f.year).filter(Boolean);
  $("pool-line").textContent = `${pool().length} star pairs · ${Object.keys(films).length.toLocaleString()} films from ${Math.min(...years)}–${Math.max(...years)} · main cast only`;
}
document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  level = b.dataset.level; updatePoolLine();
}));

const clock = Kit.countdown({ ring: $("t-ring"), text: $("t-text"), onEnd: () => finishRound("time") });

function startGame() {
  queue = pool().slice().sort(() => Math.random() - 0.5).slice(0, R.rounds);
  round = 0; score = 0; history = [];
  $("r-total").textContent = $("v-total").textContent = queue.length;
  nextRound();
}

function nextRound() {
  if (round >= queue.length) return endGame();
  cur = queue[round++]; chain = [cur.from]; misses = [];
  $("r-num").textContent = $("v-num").textContent = round;
  renderMisses(); render(); show("round"); clock.start(R.round_seconds);
}

const filmCount = (c) => c.filter(isFilm).length;

// The route so far: FROM plate, each film and co-star, an empty slot for the next step, TO plate.
function railHTML(c, from, to, { small = false, slot = "", par = null } = {}) {
  const steps = c.slice(1);
  const done = steps.at(-1) === to;
  let html = `<div class="plate from"><div><div class="k">FROM</div><div class="n">${esc(names[from])}</div></div>${
    par !== null ? `<div class="stub"><b>${par}</b><small>PAR</small></div>` : ""}</div>`;
  const hops = [];
  for (let i = 0; i < steps.length; i += 2) {
    const f = films[steps[i]], who = steps[i + 1];
    hops.push(`<div class="reel"><b>${esc(f.title)}</b><small>${f.year || ""}</small></div>` +
      (who && who !== to ? `<div class="who">${esc(names[who])}</div>` : ""));
  }
  if (slot) hops.push(`<div class="slot">${esc(slot)}</div>`);
  if (hops.length) html += `<div class="hop">${hops.join("")}</div>`;
  html += `<div class="plate to${done && !small ? " pop" : ""}"><div><div class="k">TO</div><div class="n">${esc(names[to])}</div></div>${
    par !== null ? `<div class="stub"><b>${filmCount(c)}</b><small>FILMS</small></div>` : ""}</div>`;
  return `<div class="rail${small ? " small" : ""}">${html}</div>`;
}

function render() {
  const last = chain.at(-1), onFilm = isFilm(last);
  $("rail").outerHTML = railHTML(chain, cur.from, cur.to, { slot: onFilm ? "Next: pick a co-star" : "Next: a film", par: cur.par }).replace('class="rail"', 'class="rail" id="rail" aria-live="polite"');
  $("btn-undo").disabled = chain.length <= 1;
  $("btn-undo").style.opacity = chain.length <= 1 ? .45 : 1;
  $("answer-form").classList.toggle("hidden", onFilm);
  $("cast").classList.toggle("hidden", !onFilm);
  if (onFilm) {
    const used = new Set(chain);
    const options = [...films[last].cast].filter((p) => !used.has(p)).sort((a, b) => (filmsOf[b]?.length || 0) - (filmsOf[a]?.length || 0));
    $("prompt").innerHTML = options.length ? `Who in <b>${esc(films[last].title)}</b> do you jump to?` : `No one new in <b>${esc(films[last].title)}</b>. Undo and try another film.`;
    $("cast").innerHTML = options.map((p) => `<button type="button" data-p="${esc(p)}">${esc(names[p])}</button>`).join("");
    $("cast").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { chain.push(b.dataset.p); misses = []; renderMisses(); render(); }));
  } else {
    $("prompt").innerHTML = `Name a film with <b>${esc(names[last])}</b>`;
    films_.focus();
  }
}

// Film search: prefix matches first, then anywhere; ties go to the better-known film.
const filmList = DATA.films.map(([id]) => films[id]);
const films_ = Kit.autocomplete({
  form: $("answer-form"), input: $("film-input"), list: $("suggest"),
  search(q) {
    const n = norm(q), pre = [], mid = [];
    for (const f of filmList) {
      if (f.keys.some((k) => k.startsWith(n))) pre.push(f); else if (f.keys.some((k) => k.includes(n))) mid.push(f);
      if (pre.length >= 4) break;
    }
    return [...pre, ...mid].map((f) => ({ label: f.title, meta: f.year || "", value: f.id }));
  },
  onPick: (it) => pickFilm(it.value),
  onText: () => miss("Pick a film from the list"),
});

function pickFilm(fid) {
  const who = chain.at(-1), f = films[fid];
  if (chain.includes(fid)) return miss(`${f.title} is already in your chain`);
  if (!f.cast.has(who)) {
    Kit.save(`disputes/${cur.id}-${Kit.tag()}-${Date.now()}`, { puzzle: cur.id, actor: who, actor_name: names[who], film: fid, film_title: f.title });
    return miss(`${names[who]} isn't in our cast list for ${f.title}`);
  }
  chain.push(fid); misses = []; renderMisses();
  if (f.cast.has(cur.to)) { chain.push(cur.to); render(); return setTimeout(() => finishRound("solved"), 450); }
  render();
}
function miss(text) { misses = [text]; renderMisses(); Kit.shake($("field")); }
function renderMisses() { $("misses").innerHTML = misses.map((m) => `<s style="text-decoration:none">${esc(m)}</s>`).join(""); }

$("btn-undo").addEventListener("click", () => { if (chain.length > 1) { chain.pop(); misses = []; renderMisses(); render(); } });
$("btn-give-up").addEventListener("click", () => finishRound("gave-up"));

const rate = Kit.rating({ container: $("rate"), storeKey: "cs-ratings" });

function points(films_used, secondsLeft) {
  const base = Math.max(R.min_points, R.par_points - R.over_par_penalty * (films_used - cur.par));
  return base + Math.round(R.speed_bonus * secondsLeft / R.round_seconds);
}

function finishRound(how) {
  clock.stop();
  if (how === "solved" && chain.at(-1) !== cur.to) return;
  const solved = how === "solved", used = filmCount(chain), pts = solved ? points(used, clock.left) : 0;
  score += pts;
  history.push({ cur, solved, used, pts });
  Kit.save(`plays/${cur.id}-${Kit.tag()}-${Date.now()}`, {
    puzzle: cur.id, from: names[cur.from], to: names[cur.to], par: cur.par, level: cur.level, solved, how,
    films_used: solved ? used : null, chain: chain.map(label), seconds_left: clock.left });

  const over = used - cur.par;
  $("v-score").textContent = score.toLocaleString();
  $("v-verdict").className = "verdict " + (!solved ? "lose" : over === 0 ? "win" : "near");
  $("v-verdict").textContent = !solved ? (how === "time" ? "Time's up" : "Gave up")
    : over === 0 ? `Par! Linked in ${used}` : `Linked in ${used} · ${over} over par`;
  $("v-duo").innerHTML = `${esc(names[cur.from])}<span>×</span>${esc(names[cur.to])}`;
  $("v-points").textContent = solved ? "+" + pts : "0";
  $("v-points").className = "points" + (solved ? "" : " zero");
  $("v-yours").innerHTML = solved && chain.join() !== cur.route.join() ? `<div class="eyebrow label">Your link</div>${railHTML(chain, cur.from, cur.to, { small: true })}` : "";
  const shared = cur.par === 1 ? (filmsOf[cur.from] || []).filter((f) => films[f].cast.has(cur.to)).length : 0;
  const extra = cur.par === 1 ? (shared > 1 ? `They share ${shared} films in our data.` : "")
    : cur.routes > 1 ? `${(cur.routes - 1).toLocaleString()} other routes also make par.` : "This is the only route at par.";
  $("v-best").innerHTML = `<b>Shortest link · par ${cur.par}</b>${railHTML(cur.route, cur.from, cur.to, { small: true })}<div style="margin-top:10px">${esc(extra)}</div>`;
  rate.show(cur.id, { from: names[cur.from], to: names[cur.to], par: cur.par, level: cur.level, solved, films_used: solved ? used : null });
  $("btn-next-round").textContent = round >= queue.length ? "See final score" : "Next round";
  show("reveal");
}
$("btn-next-round").addEventListener("click", nextRound);

function endGame() {
  const pars = history.filter((h) => h.solved && h.used === h.cur.par).length, solved = history.filter((h) => h.solved).length;
  $("e-sub").textContent = `${solved} of ${history.length} linked · ${pars} at par`;
  $("e-title").textContent = score.toLocaleString() + " pts";
  $("e-line").textContent = pars === history.length ? "Every one at par. You've seen everything." : solved >= history.length / 2 ? "Proper filmography energy." : "Time for a Kollywood marathon.";
  $("e-list").innerHTML = history.map((h) => {
    const cls = !h.solved ? "miss" : h.used === h.cur.par ? "hit" : "near";
    return `<span class="mark ${cls}"></span><b>${esc(names[h.cur.from])} × ${esc(names[h.cur.to])}</b>${h.solved ? ` · ${h.used} film${h.used > 1 ? "s" : ""} (par ${h.cur.par}) · +${h.pts}` : ""}`;
  }).join("<br>");
  Kit.renderSync($("sync-note"), "the puzzle makers");
  show("end");
}
$("btn-again").addEventListener("click", () => show("start"));
$("btn-start").addEventListener("click", startGame);
updatePoolLine();
</script>
